<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>메뉴 관리 대시보드</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
    body { margin: 0; background-color: var(--bg); color: var(--text-main); }
    
    header { background: #fff; padding: 20px; text-align: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    header h1 { margin: 0; font-size: 22px; font-weight: 800; color: var(--primary); }

    .container { padding: 20px; max-width: 600px; margin: 0 auto; }

    /* 전체보기 탭 추가에 따른 유연한 그리드 레이아웃 변경 */
    .category-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; justify-content: center; }
    .cat-btn { flex: 1 1 calc(25% - 8px); min-width: 75px; padding: 14px 5px; background: #fff; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; font-weight: 700; color: var(--text-sub); text-align: center; cursor: pointer; transition: 0.2s; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }

    /* 커스텀 스마트 검색창 */
    .dropdown-wrapper { margin-bottom: 24px; }
    .dropdown-wrapper label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--text-sub); }
    .search-box { display: flex; gap: 8px; }
    .search-box input { flex: 1; padding: 14px; font-size: 16px; font-weight: 600; border: 2px solid var(--border); border-radius: 12px; outline: none; background: #fff; }
    .search-box input:focus { border-color: var(--primary); }
    .search-box button { padding: 0 16px; border-radius: 12px; font-weight: 700; white-space: nowrap; border: none; background: #e2e8f0; color: #475569; cursor: pointer; }

    /* 카드 스타일 */
    .menu-card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); }
    .menu-title { font-size: 32px; font-weight: 900; margin: 0 0 16px 0; color: var(--primary); }
    
    /* 1:1 사진 영역 */
    .img-box { width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; background: #f1f5f9; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .img-placeholder { color: #94a3b8; font-size: 14px; font-weight: 600; }

    /* 45px로 키운 정보 텍스트 */
    .recipe-details { 
      background: #f8fafc; 
      padding: 20px; 
      border-radius: 12px; 
      font-size: 45px; 
      line-height: 1.4; 
      color: #334155; 
      font-weight: 800; 
      margin-bottom: 16px; 
      white-space: pre-line; 
    }

    /* 버튼 영역 */
    .actions { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; text-align: center; }
    .btn-photo { background: #e2e8f0; color: #475569; display: block; }
    .btn-feedback { background: #fee2e2; color: #dc2626; }
    .btn-full { flex: 100%; background: #f1f5f9; color: #334155; }
    
    .status-msg { font-size: 14px; font-weight: 800; color: var(--primary); margin-top: 10px; text-align: center; }

    /* 모달 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #fff; width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; }
    .modal-content h3 { margin: 0 0 16px; }
    textarea { width: 100%; height: 100px; padding: 12px; border: 2px solid var(--border); border-radius: 12px; resize: none; outline: none; margin-bottom: 16px; font-family: inherit; font-size: 16px; }
    .modal-btns { display: flex; gap: 10px; }
    .btn-submit { background: var(--primary); color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>현장 퀄리티 관리</h1>
  </header>

  <div class="container">
    <!-- 전체보기 탭 추가 -->
    <div class="category-grid" id="category-tabs">
      <div class="cat-btn active" data-cat="전체">전체보기</div>
      <div class="cat-btn" data-cat="샐러드">샐러드</div>
      <div class="cat-btn" data-cat="델리">델리</div>
      <div class="cat-btn" data-cat="요거트">요거트</div>
      <div class="cat-btn" data-cat="과일">과일</div>
      <div class="cat-btn" data-cat="김밥">김밥</div>
      <div class="cat-btn" data-cat="말이">말이</div>
    </div>

    <!-- 메뉴 검색 -->
    <div class="dropdown-wrapper">
      <label for="menu-search">메뉴 타이핑 검색</label>
      <div class="search-box">
        <input type="text" id="menu-search" placeholder="메뉴명을 직접 입력하세요..." oninput="renderCards()">
        <button onclick="resetSearch()">입력 초기화</button>
      </div>
    </div>

    <div id="menu-container"></div>
  </div>

  <!-- 보완 요청 모달 -->
  <div class="modal-overlay" id="feedback-modal">
    <div class="modal-content">
      <h3 id="modal-title">요청사항 작성</h3>
      <textarea id="feedback-text" placeholder="현장 의견을 자유롭게 적어주세요."></textarea>
      <div class="modal-btns">
        <button class="btn btn-photo" onclick="closeModal()">취소</button>
        <button class="btn btn-submit" onclick="submitFeedback()">시트로 전송</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw5-c2tli_m9nGzhmZUapV2KrvkafC6-qhQvtRs4KU3qqj5JGG6NpxIXdy4IyYSELcU/exec'; 

    let allData = [];
    let currentCategory = '전체'; // 기본 화면을 전체보기로 설정
    let currentModalMenu = '';

    window.onload = async () => {
      document.getElementById('menu-container').innerHTML = '<p style="text-align:center; color:#64748b; padding: 40px; font-weight:bold; font-size:20px;">데이터를 빠르게 불러오는 중입니다...⏳</p>';
      
      try {
        const res = await fetch(SCRIPT_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "getData" })
        });
        
        const rawData = await res.json();
        
        if (Array.isArray(rawData)) {
            allData = rawData;
            updateCategory(currentCategory);
        } else if (rawData.data && Array.isArray(rawData.data)) {
            allData = rawData.data;
            updateCategory(currentCategory);
        } else {
            throw new Error("데이터 형식이 맞지 않습니다.");
        }
      } catch (err) {
        try {
            const getRes = await fetch(SCRIPT_URL);
            allData = await getRes.json();
            updateCategory(currentCategory);
        } catch (e2) {
            document.getElementById('menu-container').innerHTML = '<p style="text-align:center; color:red; font-size:18px;">데이터 로딩 실패<br>구글 시트 연동을 확인해주세요.</p>';
        }
      }
    };

    // 터치 충돌 방지를 위해 currentTarget 적용
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        updateCategory(e.currentTarget.dataset.cat);
      });
    });

    function updateCategory(category) {
      currentCategory = category;
      resetSearch(); 
    }

    function resetSearch() {
      document.getElementById('menu-search').value = '';
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('menu-container');
      const searchTerm = document.getElementById('menu-search').value.trim().toLowerCase();
      container.innerHTML = '';

      let renderData = allData;

      // '전체' 탭이 아닐 경우에만 해당 카테고리로 필터링 (공백 무시 trim 적용)
      if (currentCategory !== '전체') {
        renderData = renderData.filter(m => m.category && m.category.trim() === currentCategory);
      }
      
      if (searchTerm !== "") {
        renderData = renderData.filter(m => m.name.toLowerCase().includes(searchTerm));
      }

      if (renderData.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8; font-weight:bold; padding: 20px; font-size:20px;">메뉴가 없습니다.</p>';
        return;
      }

      renderData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'menu-card';
        
        const imageHTML = item.imageUrl 
          ? `<img src="${item.imageUrl}" alt="${item.name}">` 
          : `<span class="img-placeholder">등록된 사진이 없습니다.</span>`;

        const buttonsHTML = item.imageUrl
          ? `<button class="btn btn-full" onclick="openModal('${item.name}')">✍️ 보완 요청하기</button>`
          : `<label class="btn btn-photo">
               📸 사진 등록 (1:1 자동)
               <input type="file" accept="image/*" hidden onchange="handleImageUpload(event, '${item.name}')">
             </label>
             <button class="btn btn-feedback" onclick="openModal('${item.name}')">✍️ 보완 요청</button>`;

        card.innerHTML = `
          <h2 class="menu-title">${item.name}</h2>
          <div class="img-box" id="img-box-${item.name}">
            ${imageHTML}
          </div>
          <div class="recipe-details">${item.details}</div>
          <div class="actions" id="action-box-${item.name}">
            ${buttonsHTML}
          </div>
          <div id="preview-${item.name}" class="status-msg"></div>
        `;
        container.appendChild(card);
      });
    }

    function handleImageUpload(event, menuName) {
      const file = event.target.files[0];
      if (!file) return;

      const previewDiv = document.getElementById(`preview-${menuName}`);
      previewDiv.style.color = 'var(--primary)';
      previewDiv.innerText = "사진을 1:1로 자르고 전송 중입니다... ⏳";

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          const size = Math.min(img.width, img.height);
          const startX = (img.width - size) / 2;
          const startY = (img.height - size) / 2;

          canvas.width = 800;
          canvas.height = 800;
          ctx.drawImage(img, startX, startY, size, size, 0, 0, 800, 800);
          
          const base64Image = canvas.toDataURL('image/jpeg', 0.8);
          sendData(menuName, '', base64Image, previewDiv);
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    }

    function openModal(menuName) {
      currentModalMenu = menuName;
      document.getElementById('modal-title').innerText = menuName + " 요청사항";
      document.getElementById('feedback-text').value = '';
      document.getElementById('feedback-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('feedback-modal').classList.remove('active');
    }

    function submitFeedback() {
      const text = document.getElementById('feedback-text').value;
      if (!text) return alert('내용을 입력해주세요.');
      
      const btn = document.querySelector('.btn-submit');
      const originalText = btn.innerText;
      btn.innerText = "전송 중...";
      
      sendData(currentModalMenu, text, null, null).then(() => {
        alert('구글 시트에 성공적으로 반영되었습니다!');
        closeModal();
        btn.innerText = originalText;
      });
    }

    async function sendData(menuName, feedbackText, base64Image, previewDiv) {
      const payload = { menuName: menuName, feedback: feedbackText, image: base64Image };
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if(previewDiv) {
          if(base64Image && result.imageUrl) {
            document.getElementById(`img-box-${menuName}`).innerHTML = `<img src="${result.imageUrl}">`;
            document.getElementById(`action-box-${menuName}`).innerHTML = `<button class="btn btn-full" onclick="openModal('${menuName}')">✍️ 보완 요청하기</button>`;
            previewDiv.innerText = "✅ 사진이 구글 드라이브에 저장되었습니다.";
            
            const target = allData.find(m => m.name === menuName);
            if(target) target.imageUrl = result.imageUrl;
          } else if (!base64Image) {
            previewDiv.innerText = "✅ 요청이 등록되었습니다.";
          }
        }
      } catch (error) {
        if(previewDiv) {
          previewDiv.style.color = '#dc2626';
          previewDiv.innerText = "❌ 전송 실패";
        }
      }
    }
  </script>
</body>
</html>

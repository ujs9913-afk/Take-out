<script>
  // 1. 발급받으신 앱스 스크립트 URL 적용 완료
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJC7zzpxsmT2Zh0QELyeWCBju4hIjhsXqbkDG4H0CrG57KoEglZVBl6h-E-hSSa7Aw/exec'; 

  let menuData = []; // 구글 시트에서 불러올 데이터가 담길 빈 배열
  let currentMenu = '';

  // 2. 구글 시트에서 데이터를 실시간으로 불러오는 함수
  async function fetchMenuData() {
    const list = document.getElementById('menu-list');
    list.innerHTML = `<p style="grid-column: span 3; text-align: center; font-weight: bold; padding: 40px; color: #555;">구글 시트에서 레시피 데이터를 불러오는 중입니다... ⏳</p>`;

    try {
      const response = await fetch(SCRIPT_URL);
      const data = await response.json();
      
      menuData = data; // 불러온 데이터를 배열에 저장
      
      // 현재 활성화된 탭에 맞춰 화면 렌더링 (기본값: 샐러드)
      const activeTab = document.querySelector('#category-nav span.active').dataset.cat;
      renderMenu(activeTab);
    } catch (error) {
      console.error('Error fetching data:', error);
      list.innerHTML = `<p style="grid-column: span 3; text-align: center; color: #dc2626; font-weight: bold; padding: 40px;">데이터를 불러오는데 실패했습니다. 네트워크 연결을 확인해주세요.</p>`;
    }
  }

  // 3. 메뉴 렌더링 함수
  function renderMenu(category) {
    document.getElementById('current-category-title').innerText = category + ' 메뉴';
    const list = document.getElementById('menu-list');
    list.innerHTML = '';
    
    const filtered = menuData.filter(m => m.category === category);
    
    if(filtered.length === 0) {
      list.innerHTML = `<p style="grid-column: span 3; text-align: center; padding: 20px; color: #888;">이 카테고리에 등록된 메뉴가 없습니다.</p>`;
      return;
    }

    filtered.forEach(item => {
      const article = document.createElement('article');
      article.className = 'nt-card';
      article.innerHTML = `
        <div class="nt-cover ${item.coverClass}"></div>
        <div class="nt-meta">
          <small>${item.category}</small>
          <h3>${item.name}</h3>
          <div class="recipe-box">${item.details}</div>
          
          <div class="card-actions">
            <label class="btn-action btn-photo">
              📸 사진 등록
              <input type="file" accept="image/*" capture="environment" hidden onchange="handleImageUpload(event, '${item.name}')">
            </label>
            <button class="btn-action btn-feedback" onclick="openModal('${item.name}')">✍️ 보완 요청</button>
          </div>
          <div id="preview-${item.name}" class="status-msg"></div>
        </div>
      `;
      list.appendChild(article);
    });
  }

  // 4. 탭 클릭 이벤트 (네비게이션)
  document.querySelectorAll('#category-nav span').forEach(tab => {
    tab.addEventListener('click', (e) => {
      document.querySelectorAll('#category-nav span').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      renderMenu(e.target.dataset.cat);
    });
  });

  // 5. 모달 제어 로직
  function openModal(menuName) {
    currentMenu = menuName;
    document.getElementById('modal-menu-name').innerText = menuName + " 요청사항";
    document.getElementById('feedback-text').value = '';
    document.getElementById('feedback-modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('feedback-modal').classList.remove('active');
  }

  // 6. 브라우저 단에서 이미지 압축
  function handleImageUpload(event, menuName) {
    const file = event.target.files[0];
    if (!file) return;

    const previewDiv = document.getElementById(`preview-${menuName}`);
    previewDiv.style.color = '#d97706';
    previewDiv.innerText = "사진 압축 및 전송 중... ⏳";

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        const scaleSize = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scaleSize;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const base64Image = canvas.toDataURL('image/jpeg', 0.8);
        sendDataToGoogleSheet(menuName, '', base64Image, previewDiv);
      }
      img.src = e.target.result;
    }
    reader.readAsDataURL(file);
  }

  // 7. 피드백 전송 로직
  function submitFeedback() {
    const text = document.getElementById('feedback-text').value;
    if (!text) return alert('내용을 입력해주세요.');
    
    const btn = document.querySelector('.btn-submit');
    const originalText = btn.innerText;
    btn.innerText = "전송 중...";
    
    sendDataToGoogleSheet(currentMenu, text, null, null).then(() => {
      alert('구글 시트에 성공적으로 반영되었습니다!');
      closeModal();
      btn.innerText = originalText;
    });
  }

  // 8. 구글 앱스 스크립트 Fetch (POST) 요청
  async function sendDataToGoogleSheet(menuName, feedbackText, base64Image, previewDiv) {
    const payload = {
      menuName: menuName,
      feedback: feedbackText,
      image: base64Image
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: JSON.stringify(payload)
      });
      
      if(previewDiv) {
        previewDiv.style.color = '#059669';
        previewDiv.innerText = "✅ 사진이 등록되었습니다.";
      }
    } catch (error) {
      console.error('Error:', error);
      if(previewDiv) {
        previewDiv.style.color = '#dc2626';
        previewDiv.innerText = "❌ 전송 실패";
      }
    }
  }

  // 화면 로드 시 구글 시트에서 데이터 불러오기 실행
  window.onload = () => {
    fetchMenuData();
  };
</script>
